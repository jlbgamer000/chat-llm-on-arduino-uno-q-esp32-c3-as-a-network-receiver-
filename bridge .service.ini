[Unit]
Description=Fridge Hunting serial bridge (WiFi proxy)
After=network.target
Conflicts=arduino-router.service

[Service]
Type=simple
User=root
ExecStartPre=-/usr/bin/systemctl stop arduino-router
ExecStartPre=-/usr/bin/fuser -k /dev/ttyHS1
ExecStartPre=-/usr/bin/killall -9 gpioset
ExecStartPre=/bin/sleep 1
ExecStart=/usr/bin/python3 -u /home/arduino/fridge_bridge_daemon.py
Restart=on-failure
RestartSec=2

[Install]
WantedBy=multi-user.target